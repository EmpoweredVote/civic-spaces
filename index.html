    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applies the colour scheme before first paint, so there is no flash.
      // Dark is the default: only an explicit 'light' opts out. The cookie is
      // read first because it is shared across *.empowered.vote, so a choice
      // made in another EV product carries here. See src/lib/colorScheme.ts.
      (function(){var m=document.cookie.match(/(?:^|;\s*)ev_color_scheme=(light|dark)(?:;|$)/);var s=m?m[1]:null;if(!s){try{s=localStorage.getItem('ev:color-scheme')}catch(e){}}if(s!=='light')document.documentElement.classList.add('dark')})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
