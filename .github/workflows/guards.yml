name: Guards

# Why this exists
# ---------------
# This repo has no test framework. Until now `npm run build` was the entire
# automated safety net, and `tsc -b` cannot see a deleted mount: PR #133 removed
# the `<PlaceStrip>` mount from AppShell, which left `enterPlace` with exactly one
# call site — a welcome screen that renders only for signed-out visitors — and so
# silently removed the whole "look at another place" capability for every member.
# The build stayed green. `npm run check:place-entry` is what caught it, by hand,
# days later.
#
# Seven guard scripts existed at that point and CI ran none of them. This runs them.
#
# 🔴 Adding a workflow does not make a check REQUIRED. "Required to merge" is a
# branch-protection setting on `main` and has to be set in the repo's rules —
# until these job names are added there, a red run here is advisory and a PR can
# still merge over it.
#
# Three jobs, split by what they need
# -----------------------------------
# `pure` runs the four guards that are just Node reading shipped modules: no
# browser, no network, no server. They finish in seconds, so they are the ones
# worth making required first.
#
# `browser` runs the three that drive the real app through Playwright. They need
# a dev server and a Chromium, which is most of this file's length.
#
# `welcome` runs the signed-out arrival's audit, which needs the same browser
# and server but is kept separate so it does not lengthen `browser`. The
# measurements behind that choice are on the job itself.
#
# 🔴 All three run in PARALLEL, so what a job costs is not its own runtime but
# whether it is the longest one. `build` is 14-18s and `pure` 9-19s; `browser`
# is 286-293s and is the PR's critical path on its own. A job shorter than
# `browser` is free on the clock.
#
# 🔴 They need `npm run dev`, NOT `vite preview`. The guards reach the signed-out
# and dev-guest states through `?signedout=1` and `?dev=1`, both of which are
# behind `import.meta.env.DEV` and do not exist in a production bundle.
#
# 🔴 Playwright is deliberately not a dependency of this repo (see CLAUDE.md) —
# it is a global install locally. `npm i --no-save` keeps that true while giving
# CI a copy the scripts' bare `playwright` specifier resolves first, before they
# fall back to `npm root -g`. The version is pinned to the one in use locally;
# bump both together or the two environments drift without saying so.
#
# Node 24, not the 20 in build-check.yml: five of these run through
# `node --experimental-strip-types`, which needs 22 or newer. build-check is left
# alone on purpose — `npm run build` does not use type stripping and changing a
# working check is not this file's job.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PLAYWRIGHT_VERSION: '1.62.1'

jobs:
  pure:
    name: Guards (pure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      # Each on its own line rather than a loop, so a failure names the guard
      # in the step title and a reader of the run does not have to open the log.
      # `check:place-resolve` is pure WITHOUT `--live`; the live variant hits
      # ev-accounts to detect fixture drift and is deliberately not run here,
      # because a ranking change at their end is not a reason to block a PR.
      - name: check:write-access
        run: npm run check:write-access
      - name: check:composition
        run: npm run check:composition
      - name: check:place-resolve
        run: npm run check:place-resolve
      - name: check:own-place
        run: npm run check:own-place
      - name: check:agenda-topics
        run: npm run check:agenda-topics

  browser:
    name: Guards (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Install Playwright (not a repo dependency — see header)
        run: |
          npm i --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          npx playwright install --with-deps chromium

      - name: Start the dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid

      # 🔴 Poll for the port rather than sleeping. A fixed sleep either wastes
      # time or races, and a guard that runs against a server which is not up
      # yet fails in a way that looks like a product bug.
      - name: Wait for the dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev server never came up on :5173"
          cat /tmp/vite.log
          exit 1

      - name: check:place-entry
        run: npm run check:place-entry
      - name: check:explore-gate
        run: npm run check:explore-gate
      - name: check:explore-rooms
        run: npm run check:explore-rooms

      # Only on failure, and only then: the Vite log is where a 500 on a route
      # or a missing fixture actually shows up, and it is invisible otherwise.
      - name: Dev server log
        if: failure()
        run: cat /tmp/vite.log

  # The 376-assertion audit over the signed-out arrival: contrast resolved
  # through a canvas, hit-tests, the four ways out of a popup, aria-describedby
  # wiring, roster presence AND identity, reduced motion — four cells, light and
  # dark at 1440 and 390.
  #
  # 🔴 Its OWN job rather than three more steps on `browser`, and the reason is
  # a measurement, not a preference. Five runs of `Guards (browser)`: 286-293s,
  # of which ~40s is setup and ~250s the three guards. The audit takes 186s
  # locally, and those same three guards take 99.6 / 112.6 / 59.5s on that
  # machine against 91.6 / 106.8 / 55.4s here — a CI/local ratio of 0.933, so
  # ~174s is what to expect. APPENDED to `browser` that is 464s on the PR's
  # critical path, +60%. BESIDE it, this job is ~214s and finishes about 76s
  # before `browser` does, so the critical path stays ~290s and this costs
  # nothing anyone waits for. The repo is public; the extra runner minutes are
  # free.
  #
  # 🔴 `--audit-only` is not an optimisation. Without it the script writes 24
  # cells of PNGs whose whole purpose is for a human to LOOK at them, and nobody
  # looks at an artifact nobody downloads. The flag drops the shoot and keeps
  # the assertions, which are the half a machine can judge. The script already
  # exits non-zero on any FAIL or page error, so there is no wrapper here.
  #
  # 🔴 Advisory until it has a week of green — see this file's header. A job in
  # a workflow is not a requirement until its NAME is in branch protection.
  welcome:
    name: Guards (welcome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Install Playwright (not a repo dependency — see header)
        run: |
          npm i --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          npx playwright install --with-deps chromium

      - name: Start the dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid

      - name: Wait for the dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev server never came up on :5173"
          cat /tmp/vite.log
          exit 1

      # 🔴 This runs on a FRESH CLONE, which is not the environment it was
      # developed in, and the difference is measurable in the right direction:
      # with no .env.local there is no VITE_SUPABASE_URL, the app serves
      # devMockData, and the signed-out Conversations view renders its honest
      # unavailable state. Eight contrast assertions on that state SKIP on a
      # checkout pointed at production Supabase and RUN here — 376 against 368.
      # Two fresh-clone runs were byte-identical, every ratio included.
      - name: shoot:welcome --audit-only
        run: npm run shoot:welcome -- --audit-only

      - name: Dev server log
        if: failure()
        run: cat /tmp/vite.log
